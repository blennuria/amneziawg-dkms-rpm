name: build

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build el${{ matrix.el }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - el: 9
            image: quay.io/centos/centos:stream9
            mock_config: centos-stream+epel-9-x86_64
          - el: 10
            image: quay.io/centos/centos:stream10
            mock_config: centos-stream+epel-10-x86_64

    # The image must match the target EL: mock builds its bootstrap chroot
    # from the host repositories, and a cross-release bootstrap fails on GPG
    # key import. Same reason for --no-bootstrap-image below.
    container:
      image: ${{ matrix.image }}
      # mock needs mount namespaces and overlayfs to set up the chroot
      options: --privileged

    steps:
      - name: Install build tools
        run: |
          dnf install -y --nogpgcheck epel-release
          dnf install -y --nogpgcheck mock rpm-build git-core

          # mock refuses to run as root: it needs an unprivileged uid to drop
          # privileges to, and regains root through its setuid wrapper. Group
          # membership is what lets that wrapper's PAM stack through.
          useradd -m builder
          usermod -aG mock builder

      - uses: actions/checkout@v7

      - name: Prepare sources
        run: |
          set -eux
          mkdir -p sources
          # Take the URL from the spec instead of repeating it here, so a
          # version bump is a one-line edit in one file.
          url=$(rpmspec -P amneziawg-dkms.spec | awk '$1 == "Source0:" { print $2 }')
          # Source0 carries a #/basename fragment: strip it for the request,
          # keep it as the file name mock and rpmbuild expect.
          curl -fsSL -o "sources/${url##*/}" "${url%%#*}"
          # mock takes every Source and Patch from one directory
          cp -v *.patch sources/
          ls -la sources/

      # A tag carries the release too (3.1.20260906-1), so the same version can
      # be rebuilt as -2; refuse to publish packages the tag does not name.
      - name: Check tag matches spec
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          nvr=$(rpmspec -q --srpm --define 'dist %{nil}' \
                  --qf '%{version}-%{release}\n' amneziawg-dkms.spec)
          test "$GITHUB_REF_NAME" = "$nvr" || {
            echo "tag $GITHUB_REF_NAME does not match amneziawg-dkms.spec $nvr" >&2
            exit 1
          }

      - name: Build SRPM
        run: |
          set -eux
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- mock -r ${{ matrix.mock_config }} --no-bootstrap-image \
            --buildsrpm \
            --spec amneziawg-dkms.spec \
            --sources sources/ \
            --resultdir result/srpm

      - name: Build RPM
        run: |
          runuser -u builder -- mock -r ${{ matrix.mock_config }} --no-bootstrap-image \
            --rebuild result/srpm/*.src.rpm \
            --resultdir result/rpm

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: rpm-el${{ matrix.el }}
          path: |
            result/rpm/*.rpm
            !result/rpm/*.src.rpm
          if-no-files-found: error

      - name: Upload mock logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-el${{ matrix.el }}
          path: result/**/*.log
          if-no-files-found: ignore

  install-test:
    name: dkms build on el${{ matrix.el }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - el: 9
            image: quay.io/centos/centos:stream9
          - el: 10
            image: quay.io/centos/centos:stream10

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install runtime and kernel headers
        run: |
          set -eux
          dnf install -y --nogpgcheck epel-release
          # --enablerepo, not `dnf config-manager --set-enabled`: EL10 ships
          # dnf5, which dropped that flag. elfutils-libelf-devel is the reason
          # CRB has to be on at all.
          dnf install -y --nogpgcheck --allowerasing --enablerepo=crb \
              dkms kernel-devel gcc make elfutils-libelf-devel

          KVER=$(rpm -q kernel-devel --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n' | sort -V | tail -n 1)
          echo "KVER=$KVER" | tee -a "$GITHUB_ENV"
          # /lib/modules/$KVER/build is normally created by the `kernel`
          # package, which we can't install inside a container — synth it.
          if [ ! -f "/lib/modules/$KVER/build/Makefile" ]; then
              mkdir -p "/lib/modules/$KVER"
              ln -sfn "/usr/src/kernels/$KVER" "/lib/modules/$KVER/build"
          fi

      - uses: actions/download-artifact@v8
        with:
          name: rpm-el${{ matrix.el }}
          path: dist

      - name: Inspect package metadata
        run: |
          rpm -qpi dist/amneziawg-dkms-[0-9]*.noarch.rpm
          rpm -qpR dist/amneziawg-dkms-[0-9]*.noarch.rpm

      - name: Install the package
        run: dnf install -y dist/amneziawg-dkms-[0-9]*.noarch.rpm

      - name: Build the module with DKMS
        run: |
          set -eux
          VER=$(rpm -q --qf '%{VERSION}\n' amneziawg-dkms)
          # %posttrans built against $(uname -r) — which in a container is the
          # host kernel and has no headers. Drive the build for the
          # kernel-devel we actually installed.
          if ! dkms install -m amneziawg -v "$VER" -k "$KVER"; then
              cat "/var/lib/dkms/amneziawg/$VER/build/make.log" || :
              exit 1
          fi
          dkms status -m amneziawg -v "$VER" | grep -E '\binstalled\b'

          ko=$(find "/lib/modules/$KVER" -name 'amneziawg.ko*' -print -quit)
          test -n "$ko"
          modinfo "$ko"
          # The version the module reports has to be the one the RPM claims,
          # otherwise the %prep seds silently stopped matching upstream.
          test "$(modinfo -F version "$ko")" = "$VER"
          # rtnl and genl aliases are what make `ip link add type amneziawg`
          # and awg(8) load the module on demand.
          modinfo -F alias "$ko" | grep -qx 'rtnl-link-amneziawg'

      - name: Check the erase path
        run: |
          set -eux
          VER=$(rpm -q --qf '%{VERSION}\n' amneziawg-dkms)
          dnf remove -y amneziawg-dkms
          test -z "$(dkms status -m amneziawg 2>/dev/null)"
          test ! -e "/usr/src/amneziawg-$VER"

  release:
    name: release
    needs: install-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rpm-el*
          merge-multiple: true
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/*.rpm \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
